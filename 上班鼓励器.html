<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上班鼓励器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f59e0b'/%3E%3Ctext x='32' y='44' font-size='36' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<style>
/* ========== 基础与液态玻璃变量 ========== */
:root{
  /* 玻璃层（浅色） */
  --glass: rgba(255,255,255,0.55);
  --glass-strong: rgba(255,255,255,0.72);
  --glass-thin: rgba(255,255,255,0.35);
  --glass-border: rgba(255,255,255,0.7);
  --glass-highlight: rgba(255,255,255,0.85);
  --glass-shadow: 0 8px 32px rgba(60,60,120,0.12), inset 0 1px 0 rgba(255,255,255,0.9);

  /* 文字（浅色） */
  --ink-1: rgba(30,35,60,0.92);
  --ink-2: rgba(30,35,60,0.6);
  --ink-3: rgba(30,35,60,0.4);

  /* 强调 */
  --gold-1:#f59e0b;
  --gold-2:#f97316;
  --green:#34c759;
  --blue:#0a84ff;
  --purple:#bf5af2;
  --gray:#8e8e93;

  /* 页面背景 */
  --page-bg:
    radial-gradient(1200px 800px at 10% -10%, #ffd6e8 0%, transparent 50%),
    radial-gradient(1000px 700px at 110% 10%, #c5e0ff 0%, transparent 55%),
    radial-gradient(900px 900px at 50% 120%, #fff3c4 0%, transparent 55%),
    linear-gradient(180deg,#eef2ff 0%,#f5f0ff 50%,#ffeef5 100%);

  /* 鼓励语条 */
  --motto-bg: linear-gradient(135deg,rgba(255,149,0,.12),rgba(255,45,85,.08));
  --motto-border: rgba(255,149,0,.2);
  --motto-color: #7c3a0a;
  --motto-pill-bg: rgba(255,149,0,.15);
  --motto-pill-color: #b45309;

  --radius-xl:26px;
  --radius-lg:20px;
  --radius-md:14px;
}

/* 深色模式 */
body[data-theme="dark"]{
  --glass: rgba(32,32,44,0.55);
  --glass-strong: rgba(40,40,55,0.72);
  --glass-thin: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.12);
  --glass-highlight: rgba(255,255,255,0.1);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);

  --ink-1: rgba(245,245,250,0.95);
  --ink-2: rgba(235,235,245,0.65);
  --ink-3: rgba(220,220,235,0.4);

  --page-bg:
    radial-gradient(1200px 800px at 10% -10%, #3a1f4d 0%, transparent 50%),
    radial-gradient(1000px 700px at 110% 10%, #1a2a4d 0%, transparent 55%),
    radial-gradient(900px 900px at 50% 120%, #3d2a1a 0%, transparent 55%),
    linear-gradient(180deg,#0f1020 0%,#1a1428 50%,#1a1020 100%);

  --motto-bg: linear-gradient(135deg,rgba(255,149,0,.18),rgba(255,45,85,.12));
  --motto-border: rgba(255,149,0,.3);
  --motto-color: #ffd8a8;
  --motto-pill-bg: rgba(255,149,0,.2);
  --motto-pill-color: #ffb340;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum";
  color:var(--ink-1);
  /* iOS 风格柔和多色流动背景 */
  background: var(--page-bg);
  background-attachment: fixed;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-feature-settings:"tnum"}

/* ========== 主卡片（液态玻璃） ========== */
.widget{
  width:100%;max-width:460px;
  background:var(--glass);
  backdrop-filter:blur(30px) saturate(1.8);
  -webkit-backdrop-filter:blur(30px) saturate(1.8);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-xl);
  box-shadow:var(--glass-shadow);
  padding:22px 22px 24px;
  display:flex;flex-direction:column;gap:14px;
}

/* ========== 顶部栏 ========== */
.topbar{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,#ffb340,#ff6b35);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:16px;
  box-shadow:0 4px 12px rgba(255,140,60,.35), inset 0 1px 0 rgba(255,255,255,.5);
}
.brand-title{font-size:16px;font-weight:600;letter-spacing:.3px}
.icon-btn{
  width:36px;height:36px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);
  background:var(--glass-thin);
  border:1px solid var(--glass-border);
  transition:all .2s;
}
.icon-btn:hover{background:var(--glass-strong);color:var(--ink-1);transform:rotate(30deg)}

/* 休息日选择按钮 */
.rest-day-btn{
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--glass-strong);
  background:transparent;color:var(--ink-2);font-size:13px;font-weight:500;
  cursor:pointer;transition:all .2s ease;
}
.rest-day-btn:hover{background:var(--glass-strong)}
.rest-day-btn.active{
  background:linear-gradient(135deg,#ff9500,#ff6b6b);
  color:#fff;border-color:transparent;font-weight:600;
  box-shadow:0 4px 12px rgba(255,149,0,.3);
}
.icon-btn svg{width:17px;height:17px}

/* ========== 状态+时间玻璃条 ========== */
.status-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  background:var(--glass-thin);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
}
.status-left{display:flex;align-items:center;gap:10px}
.status-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--gray);
  box-shadow:0 0 0 4px rgba(142,142,147,.15);
}
.status-dot.working{background:var(--green);box-shadow:0 0 0 4px rgba(52,199,89,.18)}
.status-dot.off{background:var(--purple);box-shadow:0 0 0 4px rgba(191,90,242,.18)}
.status-text{font-size:13px;color:var(--ink-2)}
.status-text b{color:var(--ink-1);font-weight:600}
.clock-block{text-align:right}
.clock-time{
  font-size:22px;font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:.5px;line-height:1;
}
.clock-date{font-size:11px;color:var(--ink-3);margin-top:4px}

/* ========== 核心金额 ========== */
.earn-block{
  padding:18px 18px 16px;
  background:var(--glass-strong);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  position:relative;
  overflow:hidden;
}
.earn-label{
  font-size:12px;color:var(--ink-3);
  letter-spacing:.5px;margin-bottom:6px;
}
.earn-main{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  position:relative;
}
.earn-text{flex:1;min-width:0}
.earn-value{
  font-size:42px;font-weight:700;line-height:1.05;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--ink-1) 0%,#5b6ab0 55%,#ff9500 130%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:-1px;
  display:inline-block;
}
.earn-value.bump{animation:bump .4s ease}
@keyframes bump{
  0%{transform:scale(1)}
  40%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
.earn-unit{font-size:18px;font-weight:500;color:var(--ink-3);margin-left:4px;-webkit-text-fill-color:var(--ink-3)}

/* 金币按钮 */
.coin-btn{
  flex-shrink:0;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(145deg,#ffd76a,#ff9500);
  border:2px solid #fff3c4;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(255,149,0,.45), inset 0 2px 4px rgba(255,255,255,.5), inset 0 -3px 6px rgba(180,83,9,.3);
  cursor:pointer;
  transition:transform .15s;
  position:relative;z-index:2;
}
.coin-btn:hover{transform:scale(1.08)}
.coin-btn:active{transform:scale(.92)}
.coin-icon{
  font-size:24px;font-weight:800;color:#7c3a0a;
  text-shadow:0 1px 0 rgba(255,255,255,.4);
  font-family:Georgia,serif;
}

/* 金币飘落层 */
.coin-layer{
  position:absolute;inset:0;
  pointer-events:none;overflow:hidden;z-index:1;
}
.coin-fly{
  position:absolute;
  width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#ffe89a,#ffb340 60%,#d97706);
  border:1.5px solid #fff3c4;
  box-shadow:0 2px 6px rgba(255,149,0,.5);
  font-size:11px;font-weight:700;color:#7c3a0a;
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;
  left:50%;top:-30px;
  animation:coinFall 1.2s cubic-bezier(.4,.1,.6,1) forwards;
}
@keyframes coinFall{
  0%{transform:translate(0,0) rotate(0deg) scale(.6);opacity:0}
  10%{opacity:1}
  80%{opacity:1}
  100%{transform:translate(var(--dx),calc(120px + var(--dy))) rotate(540deg) scale(.2);opacity:0}
}
.speed-row{
  display:flex;align-items:center;gap:8px;margin-top:10px;
  font-size:13px;color:var(--ink-2);flex-wrap:wrap;
}
.speed-num{
  font-weight:600;color:#ff6b35;
  font-variant-numeric:tabular-nums;
  font-size:14px;
}
.remain-pill{
  margin-left:auto;
  font-size:12px;color:var(--motto-pill-color);
  background:var(--motto-pill-bg);
  padding:4px 11px;border-radius:20px;
  font-variant-numeric:tabular-nums;
  backdrop-filter:blur(10px);
}

/* ========== 鼓励语 ========== */
.motto-block{
  padding:13px 15px;
  background:var(--motto-bg);
  border:1px solid var(--motto-border);
  border-radius:var(--radius-md);
  display:flex;align-items:center;gap:10px;
}
.motto{
  flex:1;font-size:13.5px;line-height:1.55;color:var(--motto-color);
}
.motto-refresh{
  flex-shrink:0;
  width:30px;height:30px;border-radius:10px;
  background:rgba(255,255,255,.5);
  border:1px solid var(--motto-border);
  display:flex;align-items:center;justify-content:center;
  color:var(--motto-pill-color);
  transition:transform .4s;
}
.motto-refresh:hover{transform:rotate(180deg)}
.motto-refresh svg{width:14px;height:14px}

/* ========== 计时按钮 ========== */
.timer-btn{
  width:100%;
  padding:12px;
  border-radius:var(--radius-md);
  font-size:13.5px;font-weight:500;
  background:var(--glass-thin);
  border:1px solid var(--glass-border);
  color:var(--ink-2);
  transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  backdrop-filter:blur(10px);
}
.timer-btn:hover{background:var(--glass-strong);color:var(--ink-1)}
.timer-btn.paused{
  background:linear-gradient(135deg,#34c759,#248a3d);
  color:#fff;
  border-color:transparent;
  box-shadow:0 6px 16px rgba(52,199,89,.35), inset 0 1px 0 rgba(255,255,255,.3);
}
.timer-btn .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6}

/* ========== 进度条 ========== */
.progress-block{
  padding:14px 16px;
  background:var(--glass-thin);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
}
.progress-head{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:12.5px;color:var(--ink-2);margin-bottom:10px;
}
.progress-head .pct{font-weight:600;color:var(--ink-1);font-size:15px;font-variant-numeric:tabular-nums}
.progress-track{
  height:9px;border-radius:6px;
  background:rgba(255,255,255,.5);
  overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.06);
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#ffb340,#ff6b35);
  border-radius:6px;
  transition:width .6s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 8px rgba(255,107,53,.4);
}
.progress-sub{
  font-size:11.5px;color:var(--ink-3);margin-top:8px;
  font-variant-numeric:tabular-nums;
}

/* ========== 数据网格 2列，本月累计跨两列 ========== */
.cards{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.card{
  background:var(--glass-thin);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
  padding:12px 14px;
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}
.card.span2{grid-column:span 2;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card.span2 .card-label{margin-bottom:0}
.card-label{font-size:11px;color:var(--ink-3);margin-bottom:5px;letter-spacing:.3px}
.card-value{
  font-size:17px;font-weight:600;color:var(--ink-1);
  font-variant-numeric:tabular-nums;
}
.card-value .unit{font-size:11px;color:var(--ink-3);font-weight:400;margin-left:2px}
.card-note{font-size:10px;color:var(--ink-3);margin-top:5px;line-height:1.4}

/* 可编辑卡片 */
.card.editable{cursor:text;position:relative}
.card.editable:hover{border-color:rgba(255,149,0,.35)}
.card.editable:hover::after{
  content:"点击编辑";
  position:absolute;top:8px;right:10px;
  font-size:9px;color:var(--motto-pill-color);
  opacity:.7;
}
.card input.inline-edit{
  width:90px;padding:4px 6px;
  font-size:17px;font-weight:600;font-family:inherit;
  color:var(--ink-1);font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.6);
  border:1px solid rgba(255,149,0,.4);
  border-radius:8px;outline:none;
}
.card input.inline-edit.small{font-size:15px;width:70px}

/* ========== 设置弹窗（液态玻璃） ========== */
.mask{
  position:fixed;inset:0;
  background:rgba(30,30,60,.25);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.mask.show{display:flex}
.dialog{
  width:100%;max-width:390px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(40px) saturate(1.8);
  -webkit-backdrop-filter:blur(40px) saturate(1.8);
  border:1px solid rgba(255,255,255,.8);
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.9);
  padding:24px;
  animation:pop .2s cubic-bezier(.4,0,.2,1);
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.dialog h3{font-size:17px;margin-bottom:18px;font-weight:600}
.field{margin-bottom:13px}
.field label{
  display:block;font-size:12px;color:var(--ink-2);
  margin-bottom:6px;font-weight:500;
}
.field input,.field select{
  width:100%;
  padding:10px 12px;
  border:1px solid rgba(30,35,60,.1);
  border-radius:12px;
  font-size:14px;
  outline:none;
  transition:all .15s;
  background:rgba(255,255,255,.7);
  color:var(--ink-1);
}
.field input:focus,.field select:focus{
  border-color:#ff9500;background:#fff;
  box-shadow:0 0 0 4px rgba(255,149,0,.12);
}
.field .err{font-size:11px;color:#ff3b30;margin-top:4px;display:none}
.field.invalid .err{display:block}
.field.invalid input{border-color:#ff3b30}
.dialog-actions{display:flex;gap:8px;margin-top:20px}
.btn{
  flex:1;padding:11px;border-radius:12px;font-size:14px;font-weight:500;
  transition:all .15s;
}
.btn-primary{
  background:linear-gradient(135deg,#ffb340,#ff6b35);
  color:#fff;
  box-shadow:0 6px 16px rgba(255,107,53,.35), inset 0 1px 0 rgba(255,255,255,.3);
}
.btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-ghost{background:rgba(30,35,60,.06);color:var(--ink-2)}
.btn-ghost:hover{background:rgba(30,35,60,.1);color:var(--ink-1)}

/* ========== 下班庆祝彩蛋 ========== */
.celebrate-overlay{
  position:fixed;inset:0;
  pointer-events:none;z-index:200;
  overflow:hidden;
}
.celebrate-text{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.8);
  font-size:48px;font-weight:800;
  background:linear-gradient(135deg,#ff9500,#ff3b30);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  opacity:0;
  animation:celebrateIn 2.5s ease forwards;
  letter-spacing:4px;
  text-shadow:0 4px 20px rgba(255,149,0,.3);
  z-index:201;
}
@keyframes celebrateIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  30%{transform:translate(-50%,-50%) scale(1)}
  80%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.2) translateY(-30px)}
}
.big-coin{
  position:absolute;top:-40px;
  width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#ffe89a,#ffb340 60%,#d97706);
  border:2px solid #fff3c4;
  box-shadow:0 3px 8px rgba(255,149,0,.5);
  font-size:13px;font-weight:700;color:#7c3a0a;
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;
  animation:bigCoinFall linear forwards;
}
@keyframes bigCoinFall{
  to{transform:translateY(110vh) rotate(720deg)}
}

/* ========== 响应式 ========== */
@media (max-width:480px){
  body{padding:14px}
  .widget{padding:18px;gap:12px}
  .earn-value{font-size:42px}
  .cards{grid-template-columns:1fr 1fr;gap:8px}
  .field input,.field select{font-size:16px}
}

/* ========== 下班冲刺模式 ========== */
.widget.sprint .earn-block{
  border-color:rgba(255,59,48,.4);
  box-shadow:0 0 24px rgba(255,59,48,.25), inset 0 1px 0 rgba(255,255,255,.9);
  animation:sprintPulse 1.5s ease-in-out infinite;
}
@keyframes sprintPulse{
  0%,100%{box-shadow:0 0 16px rgba(255,59,48,.2), inset 0 1px 0 rgba(255,255,255,.9)}
  50%{box-shadow:0 0 30px rgba(255,59,48,.45), inset 0 1px 0 rgba(255,255,255,.9)}
}
.widget.sprint .progress-fill{
  background:linear-gradient(90deg,#ff9500,#ff3b30);
  box-shadow:0 0 10px rgba(255,59,48,.6);
}
.widget.sprint .earn-value{
  background:linear-gradient(135deg,#ff3b30 0%,#ff6b35 100%);
  -webkit-background-clip:text;background-clip:text;
}
.widget.sprint .status-text b{color:#ff3b30}
.widget.sprint .status-dot.working{
  background:#ff3b30;box-shadow:0 0 0 4px rgba(255,59,48,.25);
  animation:dotBlink 1s ease-in-out infinite;
}
@keyframes dotBlink{50%{opacity:.4}}
</style>
</head>
<body>

<!-- 极简模式视图：纯粹的小数字浮窗 -->
<div id="miniView" style="display:none;position:fixed;top:8px;right:8px;z-index:9999;
  padding:6px 14px;border-radius:20px;cursor:pointer;user-select:none;white-space:nowrap;
  background:rgba(255,255,255,0.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:all 0.3s ease;">
  <span id="miniEarn" style="font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-1)">¥0.00</span>
</div>

<div class="widget" id="mainCard">
  <!-- 顶部栏 -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">¥</div>
      <div class="brand-title">上班鼓励器</div>
    </div>
    <div style="display:flex;gap:8px">

function fmtMoney(n, d){
  if(!isFinite(n) || n < 0) n = 0;
  return n.toLocaleString("zh-CN",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtHMS(totalSec){
  totalSec = Math.max(0, Math.floor(totalSec));
  const h = String(Math.floor(totalSec/3600)).padStart(2,"0");
  const m = String(Math.floor((totalSec%3600)/60)).padStart(2,"0");
  const s = String(totalSec%60).padStart(2,"0");
  return `${h}:${m}:${s}`;
}
function hmToSec(hm){
  const [h,m] = hm.split(":").map(Number);
  return h*3600 + m*60;
}

/* ---------- 核心计算（毫秒精度，金额连续递增） ---------- */
function calc(){
  const now = (paused && pauseStartTs) ? pauseStartTs - totalPauseMs : Date.now() - totalPauseMs;
  const nowDate = new Date(now);

  // 有效日薪：月薪模式下自动换算
  const effectiveDailySalary = config.salaryType === "monthly"
    ? (config.monthlyWorkdays > 0 ? config.monthlySalary / config.monthlyWorkdays : 0)
    : config.salaryPerDay;

  const startSec = hmToSec(config.startTime);
  const startMs = startSec * 1000;
  const lunchBreakMs = (config.lunchBreak || 0) * 3600 * 1000;
  const lunchStartSec = hmToSec(config.lunchStart || "12:00");
  const lunchStartMs = lunchStartSec * 1000;
  const lunchEndMs = lunchStartMs + lunchBreakMs;
  // 有效工作时长（扣除午休）
  const effectiveWorkHours = Math.max(0, config.workHours - (config.lunchBreak || 0));
  const workMs = effectiveWorkHours * 3600 * 1000;
  const endMs = startMs + config.workHours * 3600 * 1000; // 下班时间 = 上班时间 + 总工时（含午休）
  // 当前时刻毫秒数
  const curMs = nowDate.getHours()*3600000 + nowDate.getMinutes()*60000 + nowDate.getSeconds()*1000 + nowDate.getMilliseconds();

  const perSec = workMs > 0 ? effectiveDailySalary / (workMs/1000) : 0;

  let state, workedMs, remainMs;
  if(curMs < startMs){
    state = "before"; workedMs = 0; remainMs = endMs - curMs;
  }else if(curMs < endMs){
    state = "working";
    // 已过的总时间（含午休）
    const elapsedTotal = curMs - startMs;
    // 午休重叠部分：max(0, min(curMs, lunchEndMs) - max(startMs, lunchStartMs))
    const lunchOverlap = Math.max(0, Math.min(curMs, lunchEndMs) - Math.max(startMs, lunchStartMs));
    workedMs = elapsedTotal - lunchOverlap;
    if(workedMs < 0) workedMs = 0;
    if(workedMs > workMs) workedMs = workMs;
    remainMs = endMs - curMs;
  }else{
    state = "off"; workedMs = workMs; remainMs = 0;
  }

  const workedSec = workedMs / 1000;
  const remainSec = remainMs / 1000;

  let earned = perSec * workedSec;
  if(earned > effectiveDailySalary) earned = effectiveDailySalary;
  if(earned < 0 || !isFinite(earned)) earned = 0;

  const pct = workMs > 0 ? (workedMs / workMs) * 100 : 0;
  const hourly = config.customHourlyWage != null ? config.customHourlyWage : (effectiveWorkHours > 0 ? effectiveDailySalary / effectiveWorkHours : 0);
  const fullDay = config.customFullDay != null ? config.customFullDay : effectiveDailySalary;

  // 判断某天是否为工作日（根据自定义休息日）
  const restSet = new Set(config.restDays || [0, 6]);
  function isWorkday(date){
    return !restSet.has(date.getDay());
  }

  // 本月累计（按计薪天数补算，今天按已赚）
  const year = nowDate.getFullYear(), month = nowDate.getMonth(), todayDate = nowDate.getDate();
  let monthTotal = 0;
  // 过去的工作日按满勤补算
  for(let d = 1; d < todayDate; d++){
    if(isWorkday(new Date(year, month, d))) monthTotal += effectiveDailySalary;
  }
  monthTotal += earned;
  monthTotal += (config.monthExtra || 0);

  // 本月剩余工作日（明天到月底）
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let remainWorkdays = 0;
  for(let d = todayDate + 1; d <= daysInMonth; d++){
    if(isWorkday(new Date(year, month, d))) remainWorkdays++;
  }
  remainWorkdays += (config.workdayAdjust || 0);
  if(remainWorkdays < 0) remainWorkdays = 0;

  // 距发薪日（下一次 config.paydayDate 距今还有几天）
  let paydayRemain = 0;
  const payDay = config.paydayDate > daysInMonth ? daysInMonth : config.paydayDate;
  if(todayDate < payDay){
    paydayRemain = payDay - todayDate;
  }else{
    // 下个自然月
    const nextMonth = month === 11 ? new Date(year+1, 0, 1) : new Date(year, month+1, 1);
    const nextDaysInMonth = new Date(nextMonth.getFullYear(), nextMonth.getMonth()+1, 0).getDate();
    const nextPayDay = config.paydayDate > nextDaysInMonth ? nextDaysInMonth : config.paydayDate;
    const target = new Date(nextMonth.getFullYear(), nextMonth.getMonth(), nextPayDay);
    paydayRemain = Math.round((target - nowDate) / 86400000);
  }

  return { nowDate, state, perSec, workedSec, remainSec, earned, pct, hourly,
           monthTotal, remainWorkdays, paydayRemain };
}

/* ---------- 生成鼓励语候选 ---------- */
function buildMottos(r){
  // 用户自定义文案优先
  if(config.customMotto && config.customMotto.trim()){
    return [config.customMotto.trim()];
  }
  // 冲刺模式：距下班 ≤10 分钟
  if(r.state === "working" && r.remainSec <= 600){
    const mins = Math.ceil(r.remainSec / 60);
    return [
      `最后 ${mins} 分钟！冲刺一下，马上就能解放了。`,
      `${mins} 分钟倒计时！忍住，工资就在眼前。`,
      `胜利就在前方，再撑 ${mins} 分钟，下班！`,
      `进入冲刺状态，${mins} 分钟后海阔天空。`
    ];
  }
  const lib = MOTTO_LIB[config.mottoStyle] || MOTTO_LIB.milk;
  if(r.perSec <= 0){
    return ["请在设置中填写有效的日薪与工作时长。"];
  }
  if(r.state === "before"){
    return lib.before.slice();
  }
  if(r.earned >= config.salaryPerDay){
    return lib.earnedEnough.slice();
  }
  if(r.state === "working"){
    const hrs = Math.floor(r.remainSec/3600);
    const mins = Math.floor((r.remainSec%3600)/60);
    return lib.working(hrs, mins);
  }
  return lib.off.slice();
}

/* ---------- 渲染 ---------- */
function render(){
  const r = calc();
  const pad = n => String(n).padStart(2,"0");
  el.clockTime.textContent = `${pad(r.nowDate.getHours())}:${pad(r.nowDate.getMinutes())}:${pad(r.nowDate.getSeconds())}`;
  const weekNames = ["日","一","二","三","四","五","六"];
  el.clockDate.textContent = `${r.nowDate.getMonth()+1}月${r.nowDate.getDate()}日 周${weekNames[r.nowDate.getDay()]}`;

  el.statusDot.className = "status-dot" + (r.state==="working"?" working":r.state==="off"?" off":"");
  const stateMap = {
    before:["未上班","准备出发"],
    working:["上班中","正在赚钱"],
    off:["已下班","今天辛苦啦"]
  };
  const [s1,s2] = stateMap[r.state];
  el.statusText.innerHTML = `<b>${s1}</b> · ${s2}`;

  el.earnValue.textContent = fmtMoney(r.earned, 5);
  el.speedNum.textContent = fmtMoney(r.perSec, 5);
  el.remainPill.textContent = "剩余 " + fmtHMS(r.remainSec);

  // 鼓励语：状态变化时重新生成候选池
  const newMottos = buildMottos(r);
  const sig = newMottos.join("|") + "|" + config.mottoStyle;
  if(sig !== mottoVariants._sig){
    mottoVariants = newMottos;
    mottoVariants._sig = sig;
    mottoIndex = 0;
  }
  el.motto.textContent = mottoVariants[mottoIndex % mottoVariants.length];

  el.progressPct.textContent = r.pct.toFixed(1) + "%";
  el.progressFill.style.width = Math.min(100, Math.max(0, r.pct)) + "%";
  el.progressSub.textContent = `已工作 ${(r.workedSec/3600).toFixed(2)} / ${Number(config.workHours).toFixed(2)} 小时`;

  el.monthEarn.textContent = fmtMoney(r.monthTotal, 2);
  el.hourlyWage.textContent = fmtMoney(r.hourly, 2);
  el.fullDay.textContent = fmtMoney(r.fullDay, 2);
  el.remainWorkdays.textContent = r.remainWorkdays;
  el.paydayRemain.textContent = r.paydayRemain;

  applySprint(r);

  // 极简模式同步金额
  if(el.miniEarn) el.miniEarn.textContent = "¥" + fmtMoney(r.earned, 5);
}

const coinLayer = $("coinLayer");

// Web Audio 金币音效（合成，无需外部文件）
let audioCtx = null;
function playCoinSound(){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    // 经典金币声：两个快速上升的方波音符 B5 -> E6
    const notes = [
      { freq: 987.77, start: 0, dur: 0.08 },   // B5
      { freq: 1318.51, start: 0.08, dur: 0.25 } // E6
    ];
    notes.forEach(n => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = n.freq;
      gain.gain.setValueAtTime(0, t + n.start);
      gain.gain.linearRampToValueAtTime(0.15, t + n.start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t + n.start + n.dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t + n.start);
      osc.stop(t + n.start + n.dur + 0.02);
    });
  }catch(e){ /* 忽略音频错误 */ }
}

const SPRINT_SEC = 600;
function applySprint(r){
  const isSprint = r.state === "working" && r.remainSec <= SPRINT_SEC;
  widget.classList.toggle("sprint", isSprint);
  // 检测状态切换：working -> off
  if(prevState === "working" && r.state === "off" && !paused){
    playCelebrateSound();
    rainCoins();
  }
  prevState = r.state;
}

// 冲刺模式下金币掉落加速
setInterval(() => {
  if(!paused && widget.classList.contains("sprint")){
    spawnCoin(false);
  }
}, 1500);

/* ---------- 启动 ---------- */
applyTheme();
render();
startLoop();
</script>
</body>
</html>
